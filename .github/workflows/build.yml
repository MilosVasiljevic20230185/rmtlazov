name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Podesi JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Kompajliraj i pokreni testove
        run: mvn -B clean install

      - name: Sacuvaj izvrsne jar fajlove
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lazes-jars
          path: |
            server/target/lazes-server.jar
            client/target/lazes-client.jar
          if-no-files-found: error
